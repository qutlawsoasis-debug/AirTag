<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Radar Control</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="glass-panel header">
            <h1>Radar</h1>
            <div class="status-indicator">
                <span id="bt-status-dot" class="dot disconnected"></span>
                <span id="bt-status-text">Not Connected</span>
            </div>
        </header>

        <!-- Main Content -->
        <main class="content">
            
            <!-- Connection Card -->
            <section class="card glass-panel">
                <h2>Connection</h2>
                <p class="subtitle">Connect to your ESP32 Radar</p>
                <button id="connect-btn" class="primary-btn">Connect Radar</button>
            </section>

            <!-- Target Settings Card -->
            <section class="card glass-panel disabled" id="target-card">
                <h2>Target Settings</h2>
                <p class="subtitle">Change the display name of the target</p>
                <div class="input-group">
                    <input type="text" id="target-name-input" placeholder="e.g. Olya" maxlength="10">
                    <button id="save-name-btn" class="secondary-btn">Save</button>
                </div>
            </section>

            <!-- Actions Card -->
            <section class="card glass-panel disabled" id="actions-card">
                <h2>Actions</h2>
                <p class="subtitle">Trigger hardware functions</p>
                <button id="beep-btn" class="action-btn">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
                    Play Sound
                </button>
            </section>

        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
